[project]
name = "cosmology"
version = "0.1.0"
description = "JAX cosmological distances (Adachi & Kasai 2012, arXiv:1111.6396) for flat LCDM"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Otto Akseli Hannuksela", email = "otto.akseli.hannuksela@gmail.com" }
]
keywords = ["cosmology", "luminosity distance", "angular diameter distance", "JAX"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "jax>=0.4",
]

[project.urls]
Homepage = "https://github.com/gravityhub-org/cosmology"
Repository = "https://github.com/gravityhub-org/cosmology"
"Bug Tracker" = "https://github.com/gravityhub-org/cosmology/issues"

[project.optional-dependencies]
dev = ["pytest>=7", "numpy>=1.24", "astropy>=6"]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --tb=short"
